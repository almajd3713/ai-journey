# Build the AI Journey site and publish it with GitHub Pages.
# The terrain (website/public/terrain) and content JSON are committed; the field kit
# (notebooks, HTML renders, zips) is generated here from the course folders.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check content against the notebooks
        run: |
          python -I tools/extract_content.py
          git diff --exit-code content/courses || (echo "content/courses is out of date: run tools/extract_content.py and commit" && exit 1)
          python -I tools/check_markers.py
      - name: Build the field kit
        run: |
          pip install "nbconvert==7.17.1" "nbformat==5.11.1"
          python -I tools/build_downloads.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
